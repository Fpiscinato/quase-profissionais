<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Placar de Pulso — teste</title>
<style>
  :root {
    --navy: #152142;
    --navy-light: #1f2e5c;
    --lime: #a4ce3a;
    --cream: #f2f0e6;
    --destructive: #d9483a;
    --ok: #6fd07a;
    --warn: #d4af37;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--navy);
    color: var(--cream);
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  .app {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(3vh, 10px) max(6vw, 10px);
    gap: 1.2vh;
  }

  .status-bar {
    display: flex;
    justify-content: center;
    flex-shrink: 0;
  }

  .wake-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid rgba(242, 240, 230, 0.18);
    background: rgba(242, 240, 230, 0.06);
    color: var(--cream);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: clamp(9px, 3.2vw, 12px);
    font-weight: 600;
    letter-spacing: 0.02em;
    line-height: 1.3;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--destructive);
    flex-shrink: 0;
    transition: background 0.2s ease;
  }
  .dot.is-ok { background: var(--ok); }
  .dot.is-warn { background: var(--warn); }

  .score-row {
    flex-shrink: 0;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: clamp(6px, 3vw, 14px);
    font-variant-numeric: tabular-nums;
    font-weight: 800;
  }

  .score-team {
    font-size: clamp(28px, 13vw, 52px);
    line-height: 1;
  }
  .score-team--1 { color: var(--lime); }
  .score-team--2 { color: var(--cream); }
  .score-sep { font-size: clamp(16px, 6vw, 26px); color: rgba(242, 240, 230, 0.4); }

  .pads {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.4vh;
    min-height: 0;
  }

  .pad {
    flex: 1;
    min-height: 0;
    border: none;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: clamp(13px, 6.5vw, 22px);
    transition: transform 0.08s ease, filter 0.08s ease;
  }
  .pad:active { transform: scale(0.96); filter: brightness(0.9); }

  .pad--1 { background: var(--lime); color: var(--navy); }
  .pad--2 { background: var(--cream); color: var(--navy); }

  .undo-row { flex-shrink: 0; display: flex; justify-content: center; }

  .undo-btn {
    border: 1px solid rgba(217, 72, 58, 0.55);
    background: rgba(217, 72, 58, 0.12);
    color: var(--cream);
    border-radius: 999px;
    padding: max(1.2vh, 6px) clamp(16px, 8vw, 28px);
    font-size: clamp(11px, 4vw, 15px);
    font-weight: 700;
  }
  .undo-btn:active:not(:disabled) { transform: scale(0.95); }
  .undo-btn:disabled { opacity: 0.35; }
</style>
</head>
<body>
<div class="app">
  <div class="status-bar">
    <button id="wakeBtn" class="wake-toggle" type="button" aria-pressed="false">
      <span id="wakeDot" class="dot"></span>
      <span id="wakeLabel">Tela: verificando…</span>
    </button>
  </div>

  <div class="score-row">
    <span id="score1" class="score-team score-team--1">0</span>
    <span class="score-sep">–</span>
    <span id="score2" class="score-team score-team--2">0</span>
  </div>

  <main class="pads">
    <button id="btn1" class="pad pad--1" type="button">Time 1</button>
    <button id="btn2" class="pad pad--2" type="button">Time 2</button>
  </main>

  <div class="undo-row">
    <button id="undoBtn" class="undo-btn" type="button" disabled>↺ Desfazer</button>
  </div>
</div>

<script>
  // Teste isolado, sem ligação com o app real: só pra ver se o navegador
  // do relógio abre a página, responde ao toque e segura a tela acesa.
  var log = [];
  var score1El = document.getElementById('score1');
  var score2El = document.getElementById('score2');
  var undoBtn = document.getElementById('undoBtn');

  function render() {
    var s1 = 0, s2 = 0;
    for (var i = 0; i < log.length; i++) {
      if (log[i] === 1) s1++; else s2++;
    }
    score1El.textContent = String(s1);
    score2El.textContent = String(s2);
    undoBtn.disabled = log.length === 0;
  }

  document.getElementById('btn1').addEventListener('click', function () {
    log.push(1);
    render();
  });
  document.getElementById('btn2').addEventListener('click', function () {
    log.push(2);
    render();
  });
  undoBtn.addEventListener('click', function () {
    log.pop();
    render();
  });

  // Wake Lock: mantém a tela acesa enquanto a página está aberta. Se o
  // navegador do relógio não suportar (bem possível), o botão mostra isso
  // em vez de falhar quieto.
  var wakeLock = null;
  var wakeBtn = document.getElementById('wakeBtn');
  var wakeDot = document.getElementById('wakeDot');
  var wakeLabel = document.getElementById('wakeLabel');

  function setWakeUI(state, detail) {
    wakeDot.className = 'dot' + (state === 'on' ? ' is-ok' : state === 'trying' ? ' is-warn' : '');
    var text = {
      on: 'Tela: sempre ativa',
      trying: 'Tela: tentando…',
      unsupported: 'Tela: não suportado aqui',
      failed: 'Tela: falhou — toque p/ tentar',
    }[state];
    wakeLabel.textContent = text + (detail ? ' (' + detail + ')' : '');
    wakeBtn.setAttribute('aria-pressed', state === 'on' ? 'true' : 'false');
  }

  async function requestWake() {
    if (!('wakeLock' in navigator)) {
      setWakeUI('unsupported');
      return;
    }
    setWakeUI('trying');
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      setWakeUI('on');
      wakeLock.addEventListener('release', function () {
        setWakeUI('failed', 'liberado');
      });
    } catch (err) {
      setWakeUI('failed', err && err.name ? err.name : 'erro');
    }
  }

  wakeBtn.addEventListener('click', requestWake);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && wakeLock === null) {
      requestWake();
    }
  });

  requestWake();
  render();
</script>
</body>
</html>
