<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Placar de Pulso — teste</title>
<style>
  :root {
    --navy: #152142;
    --navy-light: #1f2e5c;
    --lime: #a4ce3a;
    --cream: #f2f0e6;
    --gold: #d4af37;
    --destructive: #d9483a;
    --ok: #6fd07a;
    --warn: #d4af37;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--navy);
    color: var(--cream);
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  .app {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + max(3.5vh, 14px))
      calc(env(safe-area-inset-right, 0px) + max(6vw, 10px))
      calc(env(safe-area-inset-bottom, 0px) + max(1.5vh, 6px))
      calc(env(safe-area-inset-left, 0px) + max(6vw, 10px));
    gap: 0.7vh;
  }

  .wake-banner {
    flex-shrink: 0;
    display: block;
    width: 100%;
    border: none;
    border-radius: 8px;
    padding: 0.6vh 6px;
    font-size: clamp(9px, 3.1vw, 11px);
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.25;
    text-align: center;
    color: var(--navy);
    background: var(--destructive);
    transition: background 0.2s ease, color 0.2s ease;
  }
  .wake-banner.is-ok { background: var(--ok); }
  .wake-banner.is-warn { background: var(--warn); }
  .wake-banner.is-off { background: rgba(242, 240, 230, 0.15); color: var(--cream); }

  .score-row {
    flex-shrink: 0;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: clamp(6px, 3vw, 12px);
    font-variant-numeric: tabular-nums;
    font-weight: 800;
  }

  .score-team {
    font-size: clamp(20px, 9vw, 36px);
    line-height: 1;
  }
  .score-team--1 { color: var(--lime); }
  .score-team--2 { color: var(--cream); }
  .score-sep { font-size: clamp(12px, 4vw, 18px); color: rgba(242, 240, 230, 0.4); }

  .serve-row {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: clamp(9px, 3.2vw, 12px);
    font-weight: 700;
    color: rgba(242, 240, 230, 0.75);
  }
  .serve-ball { font-size: clamp(10px, 3.6vw, 14px); }
  .serve-side {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 1.6em;
    padding: 1px 5px;
    border-radius: 5px;
    background: rgba(164, 206, 58, 0.18);
    color: var(--lime);
  }

  .team-row {
    flex: 2.3;
    display: flex;
    flex-direction: row;
    gap: 1.6vw;
    min-height: 0;
    margin-top: 0.4vh;
  }

  .pad {
    flex: 1;
    min-width: 0;
    border: none;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: clamp(11px, 5vw, 16px);
    transition: transform 0.08s ease, filter 0.08s ease;
  }
  .pad:active { transform: scale(0.95); filter: brightness(0.9); }

  .pad--1 { background: var(--lime); color: var(--navy); }
  .pad--2 { background: var(--cream); color: var(--navy); }

  .action-row {
    flex: 1;
    display: flex;
    flex-direction: row;
    gap: 1.6vw;
    min-height: 0;
  }

  .action-btn {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    border-radius: 12px;
    font-weight: 700;
    font-size: clamp(8.5px, 3.2vw, 11px);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .action-btn .icon { font-size: clamp(13px, 5.5vw, 19px); line-height: 1; }
  .action-btn:active:not(:disabled) { transform: scale(0.95); filter: brightness(0.9); }
  .action-btn:disabled { opacity: 0.35; }

  .action-btn--undo {
    border: 1px solid rgba(217, 72, 58, 0.55);
    background: rgba(217, 72, 58, 0.14);
    color: var(--cream);
  }
  .action-btn--repeat {
    border: 1px solid rgba(212, 175, 55, 0.55);
    background: rgba(212, 175, 55, 0.14);
    color: var(--cream);
  }
</style>
</head>
<body>
<div class="app">
  <button id="wakeBtn" class="wake-banner" type="button" aria-pressed="false">
    Tela: verificando…
  </button>

  <div class="score-row">
    <span id="score1" class="score-team score-team--1">0</span>
    <span class="score-sep">–</span>
    <span id="score2" class="score-team score-team--2">0</span>
  </div>

  <div class="serve-row">
    <span class="serve-ball" aria-hidden="true">🎾</span>
    <span>JAR</span>
    <span class="serve-side">D</span>
  </div>

  <main class="team-row">
    <button id="btn1" class="pad pad--1" type="button">Time 1</button>
    <button id="btn2" class="pad pad--2" type="button">Time 2</button>
  </main>

  <div class="action-row">
    <button id="undoBtn" class="action-btn action-btn--undo" type="button" disabled>
      <span class="icon" aria-hidden="true">↺</span> Desfazer
    </button>
    <button id="repeatBtn" class="action-btn action-btn--repeat" type="button">
      <span class="icon" aria-hidden="true">🔁</span> Repetir
    </button>
  </div>
</div>

<script>
  // Teste isolado, sem ligação com o app real: só pra ver se o navegador
  // do relógio abre a página, responde ao toque e segura a tela acesa.
  // O "🎾 JAR · D" é só um placeholder visual de quem saca — ainda não
  // vem de dado real, e "Repetir" ainda não repete nada de verdade (na
  // versão real ele pediria pro tablet falar de novo no speaker dele).
  var log = [];
  var score1El = document.getElementById('score1');
  var score2El = document.getElementById('score2');
  var undoBtn = document.getElementById('undoBtn');
  var repeatBtn = document.getElementById('repeatBtn');
  var wakeBtn = document.getElementById('wakeBtn');

  function render() {
    var s1 = 0, s2 = 0;
    for (var i = 0; i < log.length; i++) {
      if (log[i] === 1) s1++; else s2++;
    }
    score1El.textContent = String(s1);
    score2El.textContent = String(s2);
    undoBtn.disabled = log.length === 0;
  }

  document.getElementById('btn1').addEventListener('click', function () {
    log.push(1);
    render();
  });
  document.getElementById('btn2').addEventListener('click', function () {
    log.push(2);
    render();
  });
  undoBtn.addEventListener('click', function () {
    log.pop();
    render();
  });

  var wakeBannerFlashTimer = null;
  repeatBtn.addEventListener('click', function () {
    var prevClass = wakeBtn.className;
    var prevText = wakeBtn.textContent;
    clearTimeout(wakeBannerFlashTimer);
    wakeBtn.textContent = '🔁 (simulado) repetiria o último anúncio no tablet';
    wakeBannerFlashTimer = setTimeout(function () {
      wakeBtn.className = prevClass;
      wakeBtn.textContent = prevText;
    }, 1400);
  });

  // Melhor esforço: tela cheia reduz a chance do sistema do relógio
  // sobrepor a própria interface dele por cima da página.
  document.addEventListener(
    'click',
    function () {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(function () {});
      }
    },
    { once: true },
  );

  // Wake Lock: mantém a tela acesa enquanto a página está aberta. Ao ser
  // liberado (ex. o sistema tirou a página de primeiro plano), zera
  // wakeLock pra que a volta em visibilitychange tente pedir de novo.
  var wakeLock = null;

  function setWakeUI(state, detail) {
    wakeBtn.className =
      'wake-banner' + (state === 'on' ? ' is-ok' : state === 'trying' ? ' is-warn' : state === 'unsupported' ? ' is-off' : '');
    var text = {
      on: 'Tela sempre ativa ✓',
      trying: 'Ativando tela sempre ligada…',
      unsupported: 'Este navegador não segura a tela ligada',
      failed: 'Tela apagou — toque aqui pra reativar',
    }[state];
    wakeBtn.textContent = text + (detail ? ' (' + detail + ')' : '');
    wakeBtn.setAttribute('aria-pressed', state === 'on' ? 'true' : 'false');
  }

  async function requestWake() {
    if (!('wakeLock' in navigator)) {
      setWakeUI('unsupported');
      return;
    }
    setWakeUI('trying');
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      setWakeUI('on');
      wakeLock.addEventListener('release', function () {
        wakeLock = null;
        setWakeUI('failed', 'liberado');
      });
    } catch (err) {
      wakeLock = null;
      setWakeUI('failed', err && err.name ? err.name : 'erro');
    }
  }

  wakeBtn.addEventListener('click', requestWake);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && wakeLock === null) {
      requestWake();
    }
  });

  requestWake();
  render();
</script>
</body>
</html>
