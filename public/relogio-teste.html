<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Placar de Pulso — teste</title>
<style>
  :root {
    --navy: #152142;
    --navy-light: #1f2e5c;
    --lime: #a4ce3a;
    --cream: #f2f0e6;
    --gold: #d4af37;
    --destructive: #d9483a;
    --ok: #6fd07a;
    --warn: #d4af37;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--navy);
    color: var(--cream);
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  .app {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + max(2vh, 8px))
      calc(env(safe-area-inset-right, 0px) + max(6vw, 10px))
      calc(env(safe-area-inset-bottom, 0px) + max(1.5vh, 6px))
      calc(env(safe-area-inset-left, 0px) + max(6vw, 10px));
    gap: 0.7vh;
    transition: filter 0.4s ease;
  }
  body.dimmed .app { filter: brightness(0.22); }

  .serve-row {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: clamp(9px, 3.2vw, 12px);
    font-weight: 700;
    color: rgba(242, 240, 230, 0.75);
  }
  .serve-ball { font-size: clamp(10px, 3.6vw, 14px); }
  .serve-side {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 1.6em;
    padding: 1px 5px;
    border-radius: 5px;
    background: rgba(164, 206, 58, 0.18);
    color: var(--lime);
  }

  .team-row {
    flex: 3;
    display: flex;
    flex-direction: row;
    gap: 4vw;
    min-height: 0;
  }

  .pad {
    position: relative;
    flex: 1;
    min-width: 0;
    border: none;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: clamp(11px, 5vw, 16px);
    transition: transform 0.08s ease, filter 0.08s ease;
  }
  .pad:active { transform: scale(0.95); filter: brightness(0.9); }

  .pad--1 { background: var(--lime); color: var(--navy); }
  .pad--2 { background: var(--cream); color: var(--navy); }

  .pad-score {
    position: absolute;
    top: 7px;
    right: 9px;
    font-size: clamp(11px, 4.6vw, 16px);
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    opacity: 0.8;
  }

  /* Faixa do meio: logo pequeno (cor normal, não mais um fundo gigante
     apagado) + status da tela — fica no vão entre os times e as ações. */
  .mid-row {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0.5vh 0;
  }
  .mid-logo { width: clamp(16px, 6vw, 22px); height: clamp(16px, 6vw, 22px); object-fit: contain; border-radius: 4px; }
  .wake-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    border: none;
    background: transparent;
    color: rgba(242, 240, 230, 0.75);
    font-size: clamp(8px, 2.8vw, 10.5px);
    font-weight: 700;
    max-width: 58vw;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .wake-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--destructive);
    flex-shrink: 0;
    transition: background 0.2s ease;
  }
  .wake-dot.is-ok { background: var(--ok); }
  .wake-dot.is-warn { background: var(--warn); }

  .action-row {
    flex: 1;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    padding: 0 9%;
    min-height: 0;
  }

  .action-btn {
    flex: 0 0 38%;
    height: 62%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    border-radius: 10px;
    font-weight: 700;
    font-size: clamp(7.5px, 2.8vw, 9.5px);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .action-btn .icon { font-size: clamp(11px, 4.6vw, 16px); line-height: 1; }
  .action-btn:active:not(:disabled) { transform: scale(0.95); filter: brightness(0.9); }
  .action-btn:disabled { opacity: 0.35; }

  .action-btn--undo {
    border: 1px solid rgba(217, 72, 58, 0.55);
    background: rgba(217, 72, 58, 0.14);
    color: var(--cream);
  }
  .action-btn--repeat {
    border: 1px solid rgba(212, 175, 55, 0.55);
    background: rgba(212, 175, 55, 0.14);
    color: var(--cream);
  }

  /* Fica invisível e "vazado" (pointer-events: none) enquanto a tela está
     no brilho normal; só aparece (e captura o primeiro toque, sem deixar
     ele acertar um botão por baixo) quando escurecida. */
  #dimOverlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: transparent;
    display: none;
  }
  body.dimmed #dimOverlay { display: block; }
</style>
</head>
<body>
<div class="app">
  <div class="serve-row">
    <span class="serve-ball" aria-hidden="true">🎾</span>
    <span>JAR</span>
    <span class="serve-side">D</span>
  </div>

  <main class="team-row">
    <button id="btn1" class="pad pad--1" type="button">
      <span id="score1" class="pad-score">0</span>
      Time 1
    </button>
    <button id="btn2" class="pad pad--2" type="button">
      <span id="score2" class="pad-score">0</span>
      Time 2
    </button>
  </main>

  <div class="mid-row">
    <img class="mid-logo" src="/logo.png" alt="" />
    <button id="wakeBtn" class="wake-pill" type="button" aria-pressed="false">
      <span id="wakeDot" class="wake-dot"></span>
      <span id="wakeLabel">verificando…</span>
    </button>
  </div>

  <div class="action-row">
    <button id="undoBtn" class="action-btn action-btn--undo" type="button" disabled>
      <span class="icon" aria-hidden="true">↺</span> Desfazer
    </button>
    <button id="repeatBtn" class="action-btn action-btn--repeat" type="button">
      <span class="icon" aria-hidden="true">🔁</span> Repetir
    </button>
  </div>
</div>
<div id="dimOverlay" aria-hidden="true"></div>

<script>
  // Teste isolado, sem ligação com o app real: só pra ver se o navegador
  // do relógio abre a página, responde ao toque e segura a tela acesa.
  // O "🎾 JAR · D" é só um placeholder visual de quem saca — ainda não
  // vem de dado real, e "Repetir" ainda não repete nada de verdade (na
  // versão real ele pediria pro tablet falar de novo no speaker dele).
  var log = [];
  var score1El = document.getElementById('score1');
  var score2El = document.getElementById('score2');
  var undoBtn = document.getElementById('undoBtn');
  var repeatBtn = document.getElementById('repeatBtn');
  var wakeBtn = document.getElementById('wakeBtn');
  var wakeDot = document.getElementById('wakeDot');
  var wakeLabel = document.getElementById('wakeLabel');

  function render() {
    var s1 = 0, s2 = 0;
    for (var i = 0; i < log.length; i++) {
      if (log[i] === 1) s1++; else s2++;
    }
    score1El.textContent = String(s1);
    score2El.textContent = String(s2);
    undoBtn.disabled = log.length === 0;
  }

  document.getElementById('btn1').addEventListener('click', function () {
    log.push(1);
    render();
  });
  document.getElementById('btn2').addEventListener('click', function () {
    log.push(2);
    render();
  });
  undoBtn.addEventListener('click', function () {
    log.pop();
    render();
  });

  var wakeFlashTimer = null;
  repeatBtn.addEventListener('click', function () {
    var prevText = wakeLabel.textContent;
    clearTimeout(wakeFlashTimer);
    wakeLabel.textContent = '🔁 repetiria no tablet (simulado)';
    wakeFlashTimer = setTimeout(function () {
      wakeLabel.textContent = prevText;
    }, 1400);
  });

  // Melhor esforço: tela cheia reduz a chance do sistema do relógio
  // sobrepor a própria interface dele por cima da página.
  document.addEventListener(
    'click',
    function () {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(function () {});
      }
    },
    { once: true },
  );

  // Escurece sozinho depois de um tempo parado (economiza um pouco de
  // bateria num mostrador OLED) e volta ao normal no primeiro toque — na
  // MESMA tela, sem sair da página. O primeiro toque enquanto está escuro
  // só "acorda" a tela (o overlay captura esse toque); não conta como
  // ponto. Não tem como detectar "olhar pro relógio" (levantar o pulso)
  // de dentro de uma página web de forma confiável — então é sempre por
  // toque mesmo.
  var DIM_DELAY_MS = 8000;
  var dimTimer = null;

  function scheduleDim() {
    clearTimeout(dimTimer);
    dimTimer = setTimeout(function () {
      document.body.classList.add('dimmed');
    }, DIM_DELAY_MS);
  }

  function wakeFromDim() {
    document.body.classList.remove('dimmed');
    scheduleDim();
  }

  document.getElementById('dimOverlay').addEventListener('click', wakeFromDim);
  ['btn1', 'btn2', 'undoBtn', 'repeatBtn', 'wakeBtn'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', scheduleDim);
  });
  scheduleDim();

  // Wake Lock: mantém a tela acesa (não apaga/bloqueia) enquanto a página
  // está aberta — o escurecimento acima é só visual, por cima disso. Ao
  // ser liberado (ex. o sistema tirou a página de primeiro plano), zera
  // wakeLock pra que a volta em visibilitychange tente pedir de novo.
  var wakeLock = null;

  function setWakeUI(state, detail) {
    wakeDot.className = 'wake-dot' + (state === 'on' ? ' is-ok' : state === 'trying' ? ' is-warn' : '');
    var text = {
      on: 'Tela sempre ativa',
      trying: 'Ativando tela…',
      unsupported: 'Sem suporte a tela ativa',
      failed: 'Apagou — toque',
    }[state];
    wakeLabel.textContent = text + (detail ? ' (' + detail + ')' : '');
    wakeBtn.setAttribute('aria-pressed', state === 'on' ? 'true' : 'false');
  }

  async function requestWake() {
    if (!('wakeLock' in navigator)) {
      setWakeUI('unsupported');
      return;
    }
    setWakeUI('trying');
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      setWakeUI('on');
      wakeLock.addEventListener('release', function () {
        wakeLock = null;
        setWakeUI('failed', 'liberado');
      });
    } catch (err) {
      wakeLock = null;
      setWakeUI('failed', err && err.name ? err.name : 'erro');
    }
  }

  wakeBtn.addEventListener('click', requestWake);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && wakeLock === null) {
      requestWake();
    }
  });

  requestWake();
  render();
</script>
</body>
</html>
